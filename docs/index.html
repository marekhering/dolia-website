<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7c4d2c">
  <meta name="description" content="">
  <title>Dolia</title>
  <link rel="preload" href="content/pl.json" as="fetch" crossorigin>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/brown/dolia-01-symbol-filled-brown.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main" data-text="navigation.skip"></a>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="Dolia">
      <img src="assets/images/logo/brown/dolia-06-logo-horizontal-brown.svg" alt="Dolia" width="316" height="93">
    </a>
    <nav data-label="navigation.label">
      <a href="#torebki" data-text="navigation.bags"></a>
      <a href="#o-marce" data-text="navigation.about"></a>
      <a href="#kontakt" data-text="navigation.contact"></a>
    </nav>
  </header>

  <main id="main">
    <section class="hero" id="top" data-label="hero.label">
      <div class="hero-copy">
        <p class="eyebrow" data-text="hero.eyebrow"></p>
        <h1><span data-text="hero.title"></span><em data-text="hero.titleAccent"></em></h1>
        <p class="intro" data-text="hero.description"></p>
      </div>
      <div class="hero-visual" id="torebki">
        <div class="gallery" id="gallery"></div>
        <div class="image-caption"><span data-text="gallery.caption"></span><span data-text="gallery.note"></span></div>
      </div>
    </section>

    <div class="section-wave" aria-hidden="true">
      <svg viewBox="0 0 1440 200" preserveAspectRatio="none" focusable="false">
        <path class="wave-sand" d="M0 38C260 140 430 130 720 62S1180 2 1440 72V112C1150 42 1000 60 720 122S250 150 0 82Z"/>
        <path class="wave-brown" d="M0 64C270 162 440 142 720 84S1180 22 1440 94V126C1170 64 1000 84 720 138S250 174 0 104Z"/>
      </svg>
    </div>

    <div class="about-backdrop">
    <section class="about section" id="o-marce" aria-labelledby="about-title">
      <div class="about-heading">
        <p class="eyebrow" data-text="about.eyebrow"></p>
        <h2 id="about-title"><span data-text="about.title"></span><em data-text="about.titleAccent"></em></h2>
      </div>
      <div class="about-copy">
        <p class="lead" data-text="about.lead"></p>
        <p data-text="about.description"></p>
        <div class="signature"><span class="signature-line" aria-hidden="true"></span><span data-text="about.signature"></span></div>
      </div>
    </section>

    </div>

    <section class="contact section" id="kontakt" aria-labelledby="contact-title">
      <div class="contact-heading">
        <p class="eyebrow" data-text="contact.eyebrow"></p>
        <h2 id="contact-title"><span data-text="contact.title"></span><em data-text="contact.titleAccent"></em></h2>
        <p data-text="contact.description"></p>
      </div>
      <div class="contact-links">
        <div id="social-links" data-social-links></div>
        <a class="social-link contact-email" id="contact-email">
          <span class="social-name">
            <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="m3 6 9 7 9-7"/>
            </svg>
            <span data-text="contact.email"></span>
          </span>
          <span class="social-status" aria-hidden="true">↗</span>
        </a>
        <p class="contact-note" data-text="contact.note"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <img src="assets/images/logo/brown/dolia-06-logo-horizontal-brown.svg" alt="Dolia" width="126" height="37" loading="lazy">
    <p data-text="footer.text"></p>
    <a class="text-link" href="#top"><span data-text="footer.backToTop"></span><span aria-hidden="true">↑</span></a>
  </footer>
  <aside class="social-dock" data-label="contact.orderLabel">
    <p data-text="contact.orderLabel"></p>
    <div data-social-links></div>
  </aside>
  <p class="load-error" id="load-error" role="alert" hidden>Nie udało się wczytać treści strony. Odśwież stronę i spróbuj ponownie.</p>
  <noscript><p class="load-error">Włącz JavaScript, aby wyświetlić treść strony Dolia.</p></noscript>
</body>
</html>
